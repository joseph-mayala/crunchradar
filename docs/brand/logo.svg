<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CrunchRadar">
  <!-- A "C" built from two radar arcs. The gap is where the needle passes; the coral dot is the crunch week it found. -->
  <g fill="none" stroke-linecap="round">
    <path d="M54.05 18.22 A26 26 0 1 0 54.05 45.78" stroke="#eceefb" stroke-width="5"/>
    <path d="M44.72 24.05 A15 15 0 1 0 44.72 39.95" stroke="#eceefb" stroke-opacity=".55" stroke-width="3.5"/>
    <path d="M32 32 L57.43 26.59" stroke="#8f94f5" stroke-width="4"/>
  </g>
  <circle cx="32" cy="32" r="2.6" fill="#eceefb"/>
  <circle cx="57.43" cy="26.59" r="4" fill="#f2606a"/>
</svg>
